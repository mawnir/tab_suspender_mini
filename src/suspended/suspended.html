<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title id="pageTitle"></title>
<link id="favicon" rel="icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #f2f5f9;
    --muted: #a7b1c2;
    --accent: #6e63f6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0; padding: 24px;
    background-color: #0e131f;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--text);
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  /* light veil, no blur — screenshot stays sharp and fully visible */
  .overlay {
    position: absolute; inset: 0;
    background-color: rgba(10, 15, 26, 0.45);
    pointer-events: none;
  }
  .card {
    position: relative;
    width: min(480px, 100%);
    background: rgba(16, 22, 36, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    padding: 32px 30px 24px;
    text-align: center;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 500; color: var(--muted);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 5px 12px;
    margin-bottom: 16px;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .icon {
    width: 52px; height: 52px; border-radius: 16px;
    background: linear-gradient(135deg, #6e63f6, #4a3fd4);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    box-shadow: 0 8px 24px rgba(110, 99, 246, 0.4);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 20px; font-weight: 700; letter-spacing: -0.01em;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .sub { margin: 0 0 20px; font-size: 14px; color: var(--muted); }
  .wake {
    display: inline-flex; align-items: center; gap: 8px;
    background: #fff; color: #111827;
    font-size: 13.5px; font-weight: 600;
    border-radius: 10px; padding: 10px 18px;
  }
  .wake svg { flex-shrink: 0; }
  .url-box {
    margin-top: 22px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.09);
  }
  a#url {
    color: #b9b3ff; text-decoration: none; font-size: 13px; word-break: break-all;
  }
  a#url:hover { text-decoration: underline; }
  a#url:focus-visible { outline: 2px solid #8f86ff; outline-offset: 3px; border-radius: 4px; }
  .foot { position: relative; margin: 16px 0 0; font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) {
    body { padding: 16px; }
    .card { padding: 26px 20px; }
  }
</style>
<script src="suspended.js" defer></script>
</head>
<body>
<div class="overlay" aria-hidden="true"></div>
<main class="card">
  <span class="badge"><span class="dot"></span>Sleeping · memory saved</span>
  <div class="icon" aria-hidden="true">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M20 13.5A8 8 0 0 1 10.5 4 8 8 0 1 0 20 13.5Z" fill="#fff"/></svg>
  </div>
  <h1 id="tabTitle"></h1>
  <p class="sub">This tab is suspended. Click anywhere to wake it.</p>
  <span class="wake">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor" stroke="none"/></svg>
    Click to wake
  </span>
  <div class="url-box">
    <a id="url" href=""></a>
  </div>
</main>
<p class="foot">Tab Suspender Mini</p>
</body>
</html>
