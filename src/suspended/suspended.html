<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title id="pageTitle"></title>
    <link id="favicon" rel="icon" href="">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-light: #c084fc;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --foreground: #f8fafc;
            --foreground-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-glow: rgba(139, 92, 246, 0.15);
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 0;
            margin: 0;
            background: var(--bg-gradient);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            color: var(--foreground);
            overflow: hidden;
            cursor: pointer;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.5);
            backdrop-filter: saturate(100%);
            -webkit-backdrop-filter: blur(8px) saturate(120%);
            z-index: 1;
        }

        .content {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 40px 30px;
            border-radius: 16px;
            position: relative;
            z-index: 2;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 0 30px var(--card-glow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
        }

        body:hover .content {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.4), 0 0 40px rgba(139, 92, 246, 0.25);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .icon-wrapper {
            font-size: 48px;
            margin-bottom: 16px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        h1 {
            margin: 0 0 12px;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        p {
            font-size: 15px;
            color: var(--foreground-muted);
            margin: 0 0 24px;
            line-height: 1.5;
        }

        .reload-hint {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
            transition: opacity 0.2s;
        }

        .url-box {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .url-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 6px;
        }

        a#url {
            color: var(--primary-light);
            text-decoration: none;
            font-size: 13px;
            word-break: break-all;
            transition: color 0.2s;
            display: inline-block;
        }

        a#url:hover {
            color: #e9d5ff;
            text-decoration: underline;
        }
    </style>
    <script src="suspended.js" defer></script>
</head>

<body>
    <div class="overlay"></div>
    <div class="content">
        <div class="icon-wrapper">💤</div>
        <h1 id="tabTitle"></h1>
        <p>This tab has been suspended to save system resources.</p>
        <span class="reload-hint">Click anywhere to awake tab</span>
        <div class="url-box">
            <div class="url-label">Original URL</div>
            <a id="url" href=""></a>
        </div>
    </div>
</body>

</html>
