<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tab Suspender Mini Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e131f;
    --bg-soft: #151c2c;
    --card: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.09);
    --text: #eef2f7;
    --muted: #9aa6b8;
    --accent: #6e63f6;
    --accent-hover: #7f75ff;
    --accent-soft: rgba(110, 99, 246, 0.14);
    --danger: #e5484d;
    --success: #30a46c;
    /* compat: popup.js writes background:var(--secondary) inline for recovery rows */
    --secondary: rgba(255, 255, 255, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    width: 360px;
    margin: 0;
    padding: 16px;
    background: radial-gradient(120% 90% at 50% 0%, #1a2340 0%, var(--bg) 55%) fixed, var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .logo {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(135deg, #6e63f6, #4a3fd4);
    display: flex; align-items: center; justify-content: center;
  }
  .header h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .header p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }
  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .actions button {
    font: inherit; font-size: 12.5px; font-weight: 600;
    padding: 9px 6px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border);
    transition: background 0.15s, border-color 0.15s, transform 0.08s;
  }
  .actions button:active { transform: scale(0.97); }
  #suspendCurrentTab { background: var(--accent); border-color: var(--accent); color: #fff; }
  #suspendCurrentTab:hover { background: var(--accent-hover); }
  #suspendOtherTabs { background: transparent; color: var(--text); }
  #suspendOtherTabs:hover { border-color: var(--danger); color: #ffb4b8; }
  #unsuspendOtherTabs { background: transparent; color: var(--text); }
  #unsuspendOtherTabs:hover { border-color: var(--success); color: #9fe8c4; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; }
  .row + .row { border-top: 1px solid rgba(255,255,255,0.06); }
  .row-text { font-weight: 500; font-size: 13.5px; }
  .row-text small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .switch { position: relative; display: inline-block; width: 38px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; cursor: pointer; background: rgba(255,255,255,0.16); border-radius: 999px; transition: background 0.2s; }
  .slider::before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(16px); }
  input:focus-visible + .slider { outline: 2px solid var(--accent-hover); outline-offset: 2px; }
  .card h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  .timer-row { display: flex; align-items: center; gap: 8px; }
  .timer-row input {
    width: 58px; padding: 7px 6px; text-align: center;
    font: inherit; font-weight: 600; color: var(--text);
    background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px;
  }
  .timer-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .timer-row span { font-size: 12px; color: var(--muted); }
  .btn {
    font: inherit; font-size: 12.5px; font-weight: 600;
    background: var(--accent-soft); color: #cfc9ff;
    border: 1px solid rgba(110,99,246,0.4); border-radius: 8px;
    padding: 7px 13px; cursor: pointer; transition: background 0.15s;
  }
  .btn:hover { background: rgba(110,99,246,0.25); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1; font: inherit; font-size: 13px; color: var(--text);
    background: rgba(0,0,0,0.3); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; min-width: 0;
  }
  .add-row input::placeholder { color: #67748a; }
  .add-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #exceptionList { list-style: none; padding: 0; margin: 8px 0 0; max-height: 120px; overflow-y: auto; }
  #exceptionList li {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    padding: 6px 6px 6px 10px; margin-top: 6px; border-radius: 8px;
    font-size: 13px;
    overflow: hidden;
  }
  /* popup.js sets the remove button inline (bold + red bg) — restyle without touching JS */
  #exceptionList li button {
    background: rgba(255,255,255,0.08) !important;
    color: var(--muted) !important;
    border: 1px solid transparent !important;
    border-radius: 6px !important;
    font-size: 13px !important;
    padding: 3px 9px !important;
    cursor: pointer;
    flex-shrink: 0;
  }
  #exceptionList li button:hover { color: #ffb4b8 !important; border-color: var(--danger) !important; }
  #recovery-container { border-color: rgba(229,72,77,0.45); }
  #recovery-container h2 { color: #ffb4b8; }
  #recovery-list { list-style: none; padding: 0; margin: 0; }
  /* popup.js writes li/button styles inline — keep modern look via override */
  #recovery-list li {
    border: 1px solid var(--border) !important;
    border-radius: 8px !important;
    margin-bottom: 6px !important;
  }
  #recovery-list li button {
    background: var(--accent) !important;
    border: none !important;
    border-radius: 7px !important;
    color: #fff !important;
    cursor: pointer;
  }
  #recovery-list li button:hover { background: var(--accent-hover) !important; }
  .tip {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: 12.5px; color: var(--muted);
    background: var(--accent-soft);
    border: 1px solid rgba(110,99,246,0.3);
    padding: 10px 12px; border-radius: 10px;
    position: relative; padding-right: 30px;
  }
  .tip strong { color: var(--text); font-weight: 600; }
  #hideInfoBtn {
    position: absolute; top: 6px; right: 6px;
    background: none; border: none; color: var(--muted);
    font-size: 13px; cursor: pointer; padding: 2px 6px; border-radius: 6px;
  }
  #hideInfoBtn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent-hover); outline-offset: 2px; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo" aria-hidden="true">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 13.5A8 8 0 0 1 10.5 4 8 8 0 1 0 20 13.5Z" fill="#fff" opacity="0.95"/></svg>
  </div>
  <div>
    <h1>Tab Suspender Mini</h1>
    <p>Rest tabs, save memory</p>
  </div>
</div>

<div class="actions">
  <button id="suspendCurrentTab">Suspend tab</button>
  <button id="suspendOtherTabs">Sleep others</button>
  <button id="unsuspendOtherTabs">Wake others</button>
</div>

<div class="card">
  <div class="row">
    <div class="row-text">Extension<small>Master switch</small></div>
    <label class="switch"><input type="checkbox" id="suspensionToggle" /><span class="slider"></span></label>
  </div>
  <div class="row">
    <div class="row-text">Auto suspend<small>Sleep idle tabs on a timer</small></div>
    <label class="switch"><input type="checkbox" id="autoSuspensionToggle" /><span class="slider"></span></label>
  </div>
  <div class="row">
    <div class="row-text">Screenshot<small>Show page preview when asleep</small></div>
    <label class="switch"><input type="checkbox" id="screenshotToggle" /><span class="slider"></span></label>
  </div>
</div>

<div class="card">
  <h2>Suspend after</h2>
  <div class="timer-row">
    <input type="number" id="suspensionHours" min="0" max="23" value="0" aria-label="Hours"><span>hr</span>
    <input type="number" id="suspensionMinutes" min="0" max="59" value="1" aria-label="Minutes"><span>min</span>
    <button id="saveTimer" class="btn" style="margin-left:auto">Save</button>
  </div>
</div>

<div class="card">
  <h2>Never suspend</h2>
  <div class="add-row">
    <input type="text" id="domainInput" placeholder="e.g. youtube.com" aria-label="Domain to never suspend">
    <button id="addDomain" class="btn">Add</button>
  </div>
  <ul id="exceptionList"></ul>
</div>

<div id="recovery-container" style="display:none;" class="card">
  <h2>Recovered tabs</h2>
  <ul id="recovery-list"></ul>
</div>

<div class="tip" id="shortcutInfo">
  <span>Press <strong>Cmd/Ctrl+Shift+X</strong> to suspend, <strong>Cmd/Ctrl+Shift+Y</strong> for other tabs.</span>
  <button id="hideInfoBtn" aria-label="Dismiss tip">✕</button>
</div>

<script src="popup.js"></script>
</body>
</html>
