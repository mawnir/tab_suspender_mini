<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Tab Suspender Settings</title>
    <style>
        :root {
            --primary: #5e5e5e;
            --primary-hover: #2563eb;
            --background: #ffffff;
            --foreground: #1f2937;
            --card: #f9fafb;
            --card-foreground: #111827;
            --secondary: #f3f4f6;
            --border: #e5e7eb;
            --info-bg: #e9e9e9;
            --info-border: #6c6c6c;
            --info-text: #043957;
        }

        body {
            width: 350px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 12px;
            margin: 0;
            background-color: var(--background);
            color: var(--foreground);
            font-size: 13px;
        }

        .info {
            background-color: var(--info-bg);
            border-left: 4px solid var(--info-border);
            color: var(--info-text);
            padding: 12px 12px;
            margin-bottom: 12px;
            border-radius: 4px;
            position: relative;
        }

        #hideInfoBtn {
            position: absolute;
            top: 6px;
            right: 8px;
            background: none;
            border: none;
            font-size: 12px;
            color: #a8b5cb;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: color 0.2s ease-in-out;
        }

        #hideInfoBtn:hover {
            color: #dc2626;
            /* subtle red on hover */
        }

        .toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .toggle-label {
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.2s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.2s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--primary);
        }

        input:checked+.slider:before {
            transform: translateX(16px);
        }

        .card {
            background-color: var(--card);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin: 0 0 8px;
            font-size: 15px;
            font-weight: 600;
            color: var(--card-foreground);
        }

        .input-group {
            margin-bottom: 8px;
        }

        label {
            display: inline-block;
            margin-bottom: 4px;
            font-weight: 500;
            font-size: 13px;
        }

        input[type="text"],
        input[type="number"] {
            width: calc(100% - 6px);
            padding: 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
        }

        input[type="number"] {
            width: 60px;
            margin-right: 4px;
        }

        .timer-input {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #addDomain {
            margin-left: 6px;
        }

        #exceptionList {
            list-style: none;
            padding: 0;
            margin-top: 5px;
            max-height: 120px;
            overflow-y: auto;
        }

        #exceptionList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--secondary);
            padding: 6px 8px;
            margin-top: 4px;
            margin-bottom: 1px;
            border-radius: 4px;
        }

        ul {
            display: inline;
        }

        .remove-domain {
            background: none;
            border: none;
            color: var(--foreground);
            font-size: 13px;
            cursor: pointer;
            padding: 2px 6px;
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        #suspendCurrentTab {
            width: 100%;
            margin-bottom: 12px;
            flex: 2 1 0;
            margin-bottom: 0;
            background-color: rgb(93, 24, 149);
            font-weight: 800;
        }

        #suspendOtherTabs {
            flex: 1 1 0;
            background-color: rgb(188, 0, 0);
            font-weight: 600;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 0;
            /* remove bottom margin so it aligns nicely */
        }

        .timer-input {
            display: flex;
            align-items: center;
            gap: 4px;
        }


        h1 {
            font-size: 19px;
            font-weight: 700;
            color: rgb(63, 16, 102);
            border-bottom: 2px solid var(--border);
            padding-bottom: 6px;
            margin-top: 0;
            margin-bottom: 18px;
            letter-spacing: 0.2px;
        }
    </style>
</head>

<body>

    <h1>Tab Suspender Mini</h1>

    <div class="toggle">
        <span class="toggle-label">Enable "Tab Suspender Mini"</span>
        <label class="switch">
            <input type="checkbox" id="suspensionToggle" />
            <span class="slider"></span>
        </label>
    </div>

    <div class="toggle">
        <span class="toggle-label">Enable Screenshots</span>
        <label class="switch">
            <input type="checkbox" id="screenshotToggle" />
            <span class="slider"></span>
        </label>
    </div>

    <div class="button-row">
        <button id="suspendCurrentTab">Suspend Current Tab</button>
        <button id="suspendOtherTabs">Suspend All Other Tabs</button>
    </div>

    <div class="card">
        <h2>Suspension Timer</h2>
        <div class="input-row">
            <div class="input-group">
                <label for="suspensionTimer">Discard after:</label>
                <div class="timer-input">
                    <input type="number" id="suspensionHours" min="0" max="23" value="0">
                    <span>hr</span>
                </div>
                <div class="timer-input">
                    <input type="number" id="suspensionMinutes" min="1" max="59" value="1">
                    <span>min</span>
                </div>
            </div>
            <button id="saveTimer">Save</button>
        </div>
    </div>


    <div class="card">
        <h2>Domain Exceptions</h2>
        <div class="input-group" style="display:flex; gap:6px;">
            <input type="text" id="domainInput" placeholder="e.g. example.com">
            <button id="addDomain">Add</button>
        </div>
        <ul id="exceptionList"></ul>
    </div>

    <div class="info" id="shortcutInfo">
        💡 Press <strong>Ctrl/Cmd+Shift+X</strong> to suspend the current tab instantly.
        <button id="hideInfoBtn" aria-label="Dismiss notification">✕</button>
    </div>


    <script src="popup.js"></script>
</body>

</html>
